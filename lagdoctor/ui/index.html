<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LagDoctor</title>
<link rel="stylesheet" href="/ui/style.css">
<link rel="icon" href="/ui/lagdoctor.ico">
<script>window.LD_TOKEN = "__TOKEN__";</script>
</head>
<body>
<!-- barra del titolo di LagDoctor: si usa solo quando la finestra e' senza bordo (WebView2) -->
<div class="titlebar" id="titlebar">
  <div class="tb-drag pywebview-drag-region" id="tb-drag"><span class="tb-page" id="tb-page"></span></div>
  <div class="tb-btns">
    <button class="tb-btn" id="tb-min" title="Riduci a icona" aria-label="Riduci a icona"><svg viewBox="0 0 10 10"><path d="M1 5.5h8"/></svg></button>
    <button class="tb-btn" id="tb-max" title="Ingrandisci" aria-label="Ingrandisci"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1.2"/></svg></button>
    <button class="tb-btn close" id="tb-close" title="Chiudi (LagDoctor resta vicino all'orologio)" aria-label="Chiudi"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6"/></svg></button>
  </div>
</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00d4ff"/></linearGradient></defs>
        <rect width="40" height="40" rx="12" fill="url(#lg-bg)"/><rect x="1" y="1" width="38" height="38" rx="11" fill="none" stroke="#fff" stroke-opacity=".22"/>
        <path d="M7 22h6l2.6-7 4.2 14 3.4-10 1.8 3H33" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="33" cy="22" r="2.2" fill="#fff"/></svg></span>
      <div><b>LagDoctor</b><small id="app-ver"></small></div>
    </div>
    <nav id="nav">
      <a data-page="home" class="active"><i>&#9673;</i>Panoramica<span class="nav-spin" id="nav-scan-spin" hidden title="Scansione delle impostazioni in corso"></span></a>
      <a data-page="tweaks"><i>&#9881;</i>Ottimizzazioni<span class="pill" id="nav-fix" hidden></span></a>
      <a data-page="driver"><i>&#9636;</i>Driver video</a>
      <a data-page="startup"><i>&#9211;</i>Avvio automatico</a>
      <a data-page="gamemode"><i>&#9654;</i>Game mode<span class="pill" id="nav-gm" hidden>ON</span></a>
      <a data-page="record"><i>&#9679;</i>Analizza gioco<span class="pill warn" id="nav-exp" hidden>test</span></a>
    </nav>
    <div class="side-foot">
      <button class="act block" id="btn-settings"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span><span>Impostazioni</span></button>
      <button class="act block" id="btn-update"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></span><span>Aggiornamenti</span><span class="upd-dot" id="nav-upd" hidden title="Aggiornamento disponibile"></span></button>
      <button class="act block" id="btn-folder"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span>Cartella report</span></button>
      <button class="act block danger" id="btn-restore"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></span><span>Ripristina tutto</span></button>
      <button class="act block" id="btn-quit"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></span><span>Esci</span></button>
    </div>
  </aside>
  <div class="content">
    <div id="update-bar" class="reboot-bar upd-bar" hidden></div>
    <div id="reboot-bar" class="reboot-bar" hidden></div>
    <main id="main"><div class="loading"><div class="spinner"></div><p>Avvio di LagDoctor, controllo il PC...</p><ul id="boot-log" class="log"></ul></div></main>
  </div>
</div>
<div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="/ui/app.js"></script>
</body>
</html>
